<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Черный квадрат со скругленными углами -->
  <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="#1A1A1A" />
  
  <!-- Буква "I" (прямоугольник) -->
  <rect x="9" y="9" width="3.5" height="14" rx="0.5" fill="#E5C3A6" />
  
  <!-- Буква "T" (горизонтальная перекладина + ножка) -->
  <rect x="14.5" y="9" width="9" height="3.5" rx="0.5" fill="#E5C3A6" />
  <rect x="17.25" y="9" width="3.5" height="14" rx="0.5" fill="#E5C3A6" />
</svg>
